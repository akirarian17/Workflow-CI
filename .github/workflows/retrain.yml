name: Retrain Model

on:
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - run: pip install mlflow pandas numpy scikit-learn

      - run: |
          cd MLProject
          mlflow run .
