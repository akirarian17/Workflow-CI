name: Retrain Model

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.21.0 pandas numpy scikit-learn

      - name: Run MLflow Tracking Server
        run: |
          mlflow server --host 127.0.0.1 --port 5000 &
          sleep 5

      - name: Run MLProject Training
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
        run: |
          mlflow run MLProject/ \
            --env-manager=local \
            --experiment-name="weatherAUS_uluru_RF"

      - name: Extract Run ID
        run: |
          echo "RUN_ID=$(ls mlruns | head -n 1)" >> $GITHUB_ENV

      - name: Compress MLflow artifacts
        run: |
          zip -r mlruns_artifact.zip mlruns/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlruns-artifact
          path: mlruns_artifact.zip

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          mlflow models build-docker \
            -m "runs:/${{ env.RUN_ID }}/model" \
            -n "${{ secrets.DOCKER_USERNAME }}/eksperimen_sml_akira-rian-satya-dhamma:latest" \
            --env-manager=local

      - name: Push Docker image
        run: |
          docker push "${{ secrets.DOCKER_USERNAME }}/eksperimen_sml_akira-rian-satya-dhamma:latest"

      - name: Show workspace
        run: |
          ls -R