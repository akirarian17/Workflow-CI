name: Retrain Model

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.21.0 pandas numpy scikit-learn

      - name: Start MLflow Tracking Server
        run: |
          mlflow server \
            --host 127.0.0.1 \
            --port 5000 \
            --backend-store-uri sqlite:///mlflow.db \
            --default-artifact-root ./mlruns &
          sleep 5

      - name: Run MLflow Project
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
        run: |
          cd MLProject
          mlflow run . \
            --env-manager=local \
            --experiment-name="weatherAUS_uluru_RF" \
            --backend local

      - name: Extract Run ID
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
        run: |
          RUN_ID=$(python -c "
          import mlflow
          client = mlflow.tracking.MlflowClient()
          exp = client.get_experiment_by_name('weatherAUS_uluru_RF')
          runs = client.search_runs([exp.experiment_id], order_by=['start_time DESC'])
          print(runs[0].info.run_id)
          ")
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: Build MLflow Docker Image
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
          MLFLOW_DOCKER_IMAGE: python:3.12-slim
        run: |
          mlflow models build-docker \
            -m "runs:/${{ env.RUN_ID }}/random_forest_model" \
            -n "${{ secrets.DOCKER_USERNAME }}/eksperimen_sml_akira-rian-satya-dhamma:latest" \
            --env-manager=local

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Image
        run: |
          docker push "${{ secrets.DOCKER_USERNAME }}/eksperimen_sml_akira-rian-satya-dhamma:latest"

      - name: Show workspace
        run: |
          ls -R
