name: Retrain Model

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow pandas numpy scikit-learn

      - name: Prepare MLflow directory
        run: |
          mkdir -p MLProject/mlruns

      - name: Set MLflow environment
        run: |
          mkdir -p MLProject/mlruns
          echo "MLFLOW_TRACKING_URI=file:./MLProject/mlruns" >> $GITHUB_ENV
          echo "MLFLOW_ALLOW_FILE_STORE=true" >> $GITHUB_ENV

      - name: Initialize MLflow experiment
        run: |
          python -c "
          import mlflow
          mlflow.set_tracking_uri('file:./mlruns')
          mlflow.create_experiment('weatherAUS_Uluru_RF')
          print('experiment initialized')"

      - name: Run MLflow Project
        run: |
          cd MLProject
          mlflow run . --env-manager local --experiment-name weatherAUS_Uluru_RF

      - name: Inspect MLflow artifacts
        run: |
          find MLProject/mlruns -type f -name "MLmodel" || true
          find MLProject/mlruns -type f -name "meta.yaml" || true

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: MLProject/mlruns

      - name: Commit MLflow artifacts
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update MLflow artifacts"
          file_pattern: MLProject/mlruns/**

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/eksperimen_sml_akira-rian-satya-dhamma:latest \
            ./MLProject/docker_test

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/eksperimen_sml_akira-rian-satya-dhamma:latest

      - name: Show workspace
        run: |
          ls -R
